    <script>
        window.APP_CONFIG = (function () {

            // Base address of the Flask server (port 5000)
            var API_BASE = "http://3.7.179.252:5000";

            return {
                API_BASE: API_BASE,

                // ---- Existing APIs (already working) ----
                SENSORS_URL:  API_BASE + "/api/sensors",     // GET   -> sensor data for the floor plan
                MESSAGES_URL: API_BASE + "/api/messages",    // GET   -> messages shown on the right panel

                // ---- "CLEAR MESSAGES" BUTTON: CALLBACK API ----
                // Flask example: @app.route("/api/msg_clear", methods=["POST"])
                CLEAR_MESSAGES_URL:    API_BASE + "/api//msg_clear",
                CLEAR_MESSAGES_METHOD: "POST",               // or "DELETE" if your route uses DELETE

                // ---- "USAGE HISTORY" BUTTON: CALLBACK API ----
                // Flask example: @app.route("/api/history", methods=["GET"])
                // Must return text, e.g. jsonify({"data": ["line 1", "line 2"]})
                HISTORY_URL:    API_BASE + "/api/history",
                HISTORY_METHOD: "GET",

                // ---- "TRANSITIONS" BUTTON: CALLBACK API ----
                // Flask example: @app.route("/api/transitions", methods=["GET"])
                // Must return an HTML table, e.g. "<table><tr><th>Time</th>...</tr>...</table>"
                // (raw HTML, or JSON like {"data": "<table>...</table>"})
                TRANSITIONS_URL:    API_BASE + "/api/transitions",
                TRANSITIONS_METHOD: "GET"
            };
        })();
    </script>
    <!-- ======================== END OF CONFIG BLOCK ======================== -->

    <style>

    <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>

<body>

    <div id="root"></div>

    <script type="text/babel" data-type="module">
        const { useState, useEffect, useRef } = React;

        // All API addresses come from the CONFIG block at the top of this file (search for "CONFIG")
        const {
            API_BASE, SENSORS_URL, MESSAGES_URL,
            CLEAR_MESSAGES_URL, CLEAR_MESSAGES_METHOD,
            HISTORY_URL, HISTORY_METHOD,
            TRANSITIONS_URL, TRANSITIONS_METHOD
        } = window.APP_CONFIG

        function SensorStatusIcon({ sensor_status, x, y }) {
            const normalizedStatus = (sensor_status || "")

            if (normalizedStatus === "KEEP_ALIVE") {
                return (
                    <g transform={`translate(${x}, ${y})`}>
                        <rect width="24" height="24" fill="transparent" pointerEvents="all" />
                        <title>Status: Working</title>
                        <circle cx="6" cy="6" r="7" fill="#22c55e" />
                    </g>
                );
            }

            if (normalizedStatus === "ON_LINE" || normalizedStatus === "ONLINE") {
                return (
                    <g transform={`translate(${x}, ${y})`} fill="none">
                        <rect width="24" height="24" fill="transparent" pointerEvents="all" />
                        <title>Status: Online</title>
                        <path d="M2 8.5C7.5 3.5 16.5 3.5 22 8.5" stroke="#22c55e" strokeWidth="1.8" strokeLinecap="round" />
                        <path d="M5.5 12C9.2 8.8 14.8 8.8 18.5 12" stroke="#22c55e" strokeWidth="1.8" strokeLinecap="round" />
                        <path d="M9 15.5C10.8 14 13.2 14 15 15.5" stroke="#22c55e" strokeWidth="1.8" strokeLinecap="round" />
                        <circle cx="12" cy="19" r="1.3" fill="#22c55e" />
                    </g>
                );
            }

            if (normalizedStatus === "OFF_LINE" || normalizedStatus === "OFFLINE") {
                return (
                    <g transform={`translate(${x}, ${y})`} fill="none">
                        <rect width="24" height="24" fill="transparent" pointerEvents="all" />
                        <title>Status: Offline</title>
                        <path d="M2 8.5C7.5 3.5 16.5 3.5 22 8.5" stroke="#ef4444" strokeWidth="1.8" strokeLinecap="round" />
                        <path d="M5.5 12C9.2 8.8 14.8 8.8 18.5 12" stroke="#ef4444" strokeWidth="1.8" strokeLinecap="round" />
                        <path d="M9 15.5C10.8 14 13.2 14 15 15.5" stroke="#ef4444" strokeWidth="1.8" strokeLinecap="round" />
                        <circle cx="12" cy="19" r="1.3" fill="#ef4444" />
                        <path d="M4 4L20 20" stroke="#ef4444" strokeWidth="1.8" strokeLinecap="round" />
                    </g>
                );
            }

            return null;
        }

        /* ---------- NEW: chat panel component ---------- */
        function ChatPanel({ messages, error, onClear }) {
            const listRef = useRef(null);
            const stickToBottom = useRef(true);

            // Track whether the user is near the bottom; if they scrolled up to read
            // older messages, we don't yank them back down when new ones arrive.
            const onScroll = () => {
                const el = listRef.current;
                stickToBottom.current = el.scrollHeight - el.scrollTop - el.clientHeight < 40;
            };

            useEffect(() => {
                const el = listRef.current;
                if (el && stickToBottom.current) el.scrollTop = el.scrollHeight;
            }, [messages]);

            return (
                <div className="chat-pane">
                    <div className="chat-header">
                        <span>Messages{messages.length > 0 ? ` (${messages.length})` : ''}</span>
                        <button type="button" className="clear-btn" onClick={onClear}
                                disabled={messages.length === 0} title="Delete all messages">
                            Clear messages
                        </button>
                    </div>
                    <div className="chat-list" ref={listRef} onScroll={onScroll}>
                        {error && <div className="chat-empty" style={{ color: '#b91c1c' }}>{error}</div>}
                        {!error && messages.length === 0 && <div className="chat-empty">No messages yet</div>}
                        {messages.map((m, i) => (
                            <div className="msg" key={m.id ?? i}>
                                {m.text}
                                {m.timestamp && (
                                    <span className="msg-time">{new Date(m.timestamp).toLocaleString()}</span>
                                )}
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        /* ---------- Usage history pop-up ---------- */
        function HistoryModal({ onClose }) {
            const [text, setText] = useState("")
            const [loading, setLoading] = useState(true)
            const [error, setError] = useState(null)

            // Accepts JSON ({ "data": ["line", ...] } or { "data": "text" } or ["line", ...]) or plain text
            const toText = (raw) => {
                try {
                    const j = JSON.parse(raw)
                    const d = (j && !Array.isArray(j) && j.data !== undefined) ? j.data : j
                    if (Array.isArray(d)) return d.join("\n")
                    if (typeof d === "string") return d
                    return JSON.stringify(d, null, 2)
                } catch (e) {
                    return raw
                }
            }

            const load = () => {
                setLoading(true)
                setError(null)
                fetch(HISTORY_URL, { method: HISTORY_METHOD })
                .then(res => {
                    if (!res.ok) throw new Error(`HTTP ${res.status} from ${HISTORY_METHOD} ${HISTORY_URL}`)
                    return res.text()
                })
                .then(raw => { setText(toText(raw)); setLoading(false) })
                .catch(err => {
                    console.error("history fetch failed:", err)
                    setError("Could not load history: " + err.message)
                    setLoading(false)
                })
            }

            useEffect(() => {
                load()
                const onKey = (e) => { if (e.key === "Escape") onClose() }
                window.addEventListener("keydown", onKey)
                return () => window.removeEventListener("keydown", onKey)
            }, [])

            return (
                <div className="modal-overlay" onClick={onClose}>
                    <div className="modal" role="dialog" aria-modal="true" aria-label="Usage Summary"
                         onClick={(e) => e.stopPropagation()}>
                        <div className="modal-head">
                            <h3 className="modal-title">Usage Summary</h3>
                            <button type="button" className="modal-x" onClick={onClose} aria-label="Close">&times;</button>
                        </div>
                        {loading && <div className="modal-body muted">Loading history...</div>}
                        {!loading && error && <div className="modal-body err">{error}</div>}
                        {!loading && !error && (
                            <div className="modal-body">{text.trim() ? text : "No history available."}</div>
                        )}
                        <div className="modal-foot">
                            <button type="button" onClick={load}>Refresh</button>
                            <button type="button" className="primary" onClick={onClose}>Close</button>
                        </div>
                    </div>
                </div>
            )
        }

        /* ---------- Transitions pop-up: shows an HTML table returned by Flask ---------- */
        function TransitionsModal({ onClose }) {
            const [html, setHtml] = useState("")
            const [loading, setLoading] = useState(true)
            const [error, setError] = useState(null)

            // Accepts raw HTML, or JSON such as { "data": "<table>...</table>" }
            const extractHtml = (raw) => {
                try {
                    const j = JSON.parse(raw)
                    if (j && typeof j.data === "string") return j.data
                    if (typeof j === "string") return j
                } catch (e) { /* not JSON: treat as raw HTML */ }
                return raw
            }

            // Remove scripts / event handlers so server content cannot run code in this page
            const clean = (dirty) => window.DOMPurify
                ? window.DOMPurify.sanitize(dirty)
                : null

            const load = () => {
                setLoading(true)
                setError(null)
                fetch(TRANSITIONS_URL, { method: TRANSITIONS_METHOD })
                .then(res => {
                    if (!res.ok) throw new Error(`HTTP ${res.status} from ${TRANSITIONS_METHOD} ${TRANSITIONS_URL}`)
                    return res.text()
                })
                .then(raw => {
                    const safe = clean(extractHtml(raw))
                    if (safe === null) throw new Error("HTML sanitizer failed to load (check internet access to unpkg.com)")
                    setHtml(safe)
                    setLoading(false)
                })
                .catch(err => {
                    console.error("transitions fetch failed:", err)
                    setError("Could not load transitions: " + err.message)
                    setLoading(false)
                })
            }

            useEffect(() => {
                load()
                const onKey = (e) => { if (e.key === "Escape") onClose() }
                window.addEventListener("keydown", onKey)
                return () => window.removeEventListener("keydown", onKey)
            }, [])

            return (
                <div className="modal-overlay" onClick={onClose}>
                    <div className="modal wide" role="dialog" aria-modal="true" aria-label="Usage History"
                         onClick={(e) => e.stopPropagation()}>
                        <div className="modal-head">
                            <h3 className="modal-title">Usage History</h3>
                            <button type="button" className="modal-x" onClick={onClose} aria-label="Close">&times;</button>
                        </div>
                        {loading && <div className="modal-body muted">Loading transitions...</div>}
                        {!loading && error && <div className="modal-body err">{error}</div>}
                        {!loading && !error && (html.trim()
                            ? <div className="modal-body html-content" dangerouslySetInnerHTML={{ __html: html }} />
                            : <div className="modal-body muted">No transitions available.</div>)}
                        <div className="modal-foot">
                            <button type="button" onClick={load}>Refresh</button>
                            <button type="button" className="primary" onClick={onClose}>Close</button>
                        </div>
                    </div>
                </div>
            )
        }

        function App() {

            const SCALE = 22
            const TOTAL_W = 30
            const TOTAL_H = 20
            const PAD = 14
            const WALL = 4
            const px = (ft) => ft * SCALE

            const [sensors, setSensors] = useState([])
            const [messages, setMessages] = useState([])   // NEW
            const [msgError, setMsgError] = useState(null)   // NEW
            const [sensorError, setSensorError] = useState(null)
            const [showHistory, setShowHistory] = useState(false)
            const [showTransitions, setShowTransitions] = useState(false)

            const rooms = [
                { sensor_room: "LivingRoom", room: 'Living Room', x: 18, y: 0,  w: 12, h: 12, fillColor: '#e8e4f5'},
                { sensor_room: "DiningRoom", room: 'Dining Room',  x: 10, y: 12, w: 20, h: 8,  fillColor: '#e8e4f5'},
                { sensor_room: "Kitchen", room: 'Kitchen', x: 0,  y: 12, w: 10, h: 8,  fillColor: '#e8e4f5'},
                { sensor_room: "BedRoom", room: 'Bed Room', x: 0,  y: 0,  w: 12, h: 12, fillColor: '#e8e4f5'},
                { sensor_room: "Toilet-1", room: 'Toilet 1',  x: 12, y: 0,  w: 6,  h: 7,  fillColor: '#e8e4f5'},
            ]

            const doors = [
                { wall: 'v', x: 12, y1: 3,  y2: 6,  hinge: 'top' },
                { wall: 'h', x1: 12, x2: 15, y: 12,  hinge: 'left'  },
                { wall: 'v', x: 18, y1: 3,  y2: 6,  hinge: 'top' },
                { wall: 'h', x1: 22, x2: 25, y: 12,  hinge: 'left'   },
                { wall: 'v', x: 10, y1: 14, y2: 17, hinge: 'top' },
                { wall: 'h', x1: 2,  x2: 5,  y: 0,   hinge: 'left' },
                { wall: 'v', x: 12, y1: 8, y2: 11, hinge: 'top' },
                { wall: 'v', x: 18, y1: 8, y2: 11, hinge: 'top' },
            ]

            const dataByRoom = Object.fromEntries(rooms.map((r) => [r.sensor_room, r]))

            // Sensor polling: loads immediately, then every 5 seconds (paused while the tab is hidden)
            useEffect(() => {
                const load = () => {
                    if (document.hidden) return;
                    fetch(SENSORS_URL)
                    .then(res => {
                        if (!res.ok) throw new Error(`HTTP ${res.status}`);
                        return res.json();
                    })
                    .then(json => { setSensors(json.data || []); setSensorError(null); })
                    .catch(err => {
                        console.error("sensor fetch failed:", err);
                        setSensorError("Unable to reach the sensor server. Retrying...");
                    });
                };
                load();
                const timer = setInterval(load, 5000);
                return () => clearInterval(timer);
            }, []);

            // Message polling. Adjust the URL / response shape to match your server.
            // Expected: { data: [ { id: 1, text: "hello", timestamp: "2025-01-01T10:00:00Z" }, ... ] }
            useEffect(() => {
                const load = () => {
                    if (document.hidden) return;
                    return fetch(MESSAGES_URL)
                    .then(res => {
                        if (!res.ok) throw new Error(`HTTP ${res.status} from /api/messages`);
                        return res.json();
                    })
                    .then(json => {
                        setMessages(json.data || []);
                        setMsgError(null);
                    })
                    .catch(err => {
                        console.error("message fetch failed:", err);
                        setMsgError("Could not load messages: " + err.message);
                    });
                };

                load();                                   // fetch immediately on page load
                const timer = setInterval(load, 5000);
                return () => clearInterval(timer)
            }, []);

            // CALLBACK for the "Clear messages" button (URL and method are set at the top of this script)
            const clearMessages = () => {
                if (!window.confirm("Clear all messages?")) return;
                fetch(CLEAR_MESSAGES_URL, { method: CLEAR_MESSAGES_METHOD })
                .then(res => {
                    if (!res.ok) throw new Error(`HTTP ${res.status} from ${CLEAR_MESSAGES_METHOD} ${CLEAR_MESSAGES_URL}`);
                    setMessages([]);
                    setMsgError(null);
                })
                .catch(err => {
                    console.error("clear messages failed:", err);
                    setMsgError("Could not clear messages: " + err.message);
                });
            };

            const svgFullWidth = px(TOTAL_W) + PAD * 2;
            const svgFullHeight = px(TOTAL_H) + PAD * 2;

            return (
                <div className="app-shell">

                    {/* HEADER: company logo + logout */}
                    <header className="topbar">
                        <div className="brand">
                            <img src="/static/logo.png" alt="ISQUARED OT LABS (OPC) PVT LTD" />
                        </div>
                        <div className="topbar-actions">
                            <button type="button" className="history-btn" onClick={() => setShowHistory(true)}>
                                Usage Summary
                            </button>
                            <button type="button" className="history-btn" onClick={() => setShowTransitions(true)}>
                                Usage History
                            </button>
                            <form method="post" action="/logout" className="logout-form">
                                <button type="submit">Log out</button>
                            </form>
                        </div>
                    </header>

                <div className="layout">

                    {/* LEFT: sensor floor plan */}
                    <div className="main-pane">

                        <h2 className="page-title">Live room occupancy and sensor status</h2>
                        <div className="legend">
                            <span><i style={{ background: '#c3e88d' }}></i>Occupied</span>
                            <span><i style={{ background: '#e8e4f5' }}></i>Empty</span>
                        </div>
                        {sensors.length > 0 ?
                            <div className="plan-card" style={{ maxWidth: svgFullWidth + 'px' }}>
                                <svg
                                    viewBox={`0 0 ${svgFullWidth} ${svgFullHeight}`}
                                    preserveAspectRatio="xMidYMid meet"
                                    style={{ width: '100%', height: 'auto', display: 'block' }}
                                >
                                    <g transform={`translate(${PAD}, ${PAD})`}>

                                        {sensors.map((s) => {
                                            const room_dim = dataByRoom[s.sensor_room]
                                            if (!room_dim) {
                                                console.warn("No matching room found for sensor id:", s.sensor_room);
                                                return null;
                                            }

                                            const occupied = s.status === "DETECTED";
                                            const cx = px(room_dim.x) + px(room_dim.w) / 2;
                                            const cy = px(room_dim.y) + px(room_dim.h) / 2;

                                            return (
                                                <g key={s.sensor_room}>
                                                    <rect
                                                        x={px(room_dim.x)}
                                                        y={px(room_dim.y)}
                                                        width={px(room_dim.w)}
                                                        height={px(room_dim.h)}
                                                        fill={occupied ? "#c3e88d" : room_dim.fillColor}
                                                    />
                                                    <SensorStatusIcon
                                                        sensor_status={s.sensor_status}
                                                        x={px(room_dim.x + room_dim.w) - 28}
                                                        y={px(room_dim.y) + 8}
                                                    />
                                                    <text x={cx} y={cy - 16} textAnchor="middle" fontSize={13} fontWeight="700" fill="#333">
                                                        {room_dim.room}
                                                    </text>
                                                    <text x={cx} y={cy + 18} textAnchor="middle" fontSize={10} fill="#333">
                                                        {new Date(s.timestamp).toLocaleDateString()}
                                                    </text>
                                                    <text x={cx} y={cy + 32} textAnchor="middle" fontSize={10} fill="#333">
                                                        {occupied ? "Occupied since" : "Empty since"} {new Date(s.timestamp).toLocaleTimeString()}
                                                    </text>
                                                </g>
                                            )
                                        })}

                                        {rooms.map((room) => (
                                            <rect
                                                key={"wall-" + room.sensor_room}
                                                x={px(room.x)}
                                                y={px(room.y)}
                                                width={px(room.w)}
                                                height={px(room.h)}
                                                fill="none"
                                                stroke="#333"
                                                strokeWidth={WALL}
                                            />
                                        ))}

                                        {doors.map((d, i) => {
                                            if (d.wall === 'v') {
                                                const x = px(d.x);
                                                const y1 = px(d.y1);
                                                const y2 = px(d.y2);
                                                return (
                                                    <g key={"door-" + i}>
                                                        <line x1={x} y1={y1} x2={x} y2={y2} stroke="#fff" strokeWidth={WALL + 2} />
                                                        <line x1={x} y1={y1} x2={x} y2={y2} stroke="#8a5a2b" strokeWidth={2} />
                                                    </g>
                                                );
                                            }
                                            const x1 = px(d.x1);
                                            const x2 = px(d.x2);
                                            const y = px(d.y);
                                            return (
                                                <g key={"door-" + i}>
                                                    <line x1={x1} y1={y} x2={x2} y2={y} stroke="#fff" strokeWidth={WALL + 2} />
                                                    <line x1={x1} y1={y} x2={x2} y2={y} stroke="#8a5a2b" strokeWidth={2} />
                                                </g>
                                            );
                                        })}

                                        <rect x={-WALL/2} y={-WALL/2} width={px(TOTAL_W) + WALL} height={px(TOTAL_H) + WALL}
                                              fill="none" stroke="#222" strokeWidth={WALL + 2} />
                                    </g>
                                </svg>
                            </div>
                        : <div className="loading">{sensorError || "Retrieving Data..."}</div>}
                    </div>

                    {/* RIGHT: scrolling chat-style messages */}
                    <ChatPanel messages={messages} error={msgError} onClear={clearMessages} />
                </div>

                {showHistory && <HistoryModal onClose={() => setShowHistory(false)} />}
                {showTransitions && <TransitionsModal onClose={() => setShowTransitions(false)} />}
                </div>
            )
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>

</body>
</html>
